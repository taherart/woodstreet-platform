services:
  woodstreet:
    build: .
    container_name: woodstreet-platform
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - NODE_ENV=production
      - HOME=/root
      - PORT=3000
    expose:
      - '3000'
    volumes:
      - woodstreet_data:/app/data
      - woodstreet_uploads:/app/public/uploads
      - /root/.hermes/mcp-tokens:/root/.hermes/mcp-tokens:ro

volumes:
  woodstreet_data:
  woodstreet_uploads:
